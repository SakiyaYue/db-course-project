{% extends "base.html" %}
{% block title %}值班团队 · Teabar{% endblock %}
{% block content %}
<h1>值班团队</h1>
<table class="table">
  <thead><tr><th>员工</th><th>姓名</th><th>角色</th><th>开始</th><th>结束</th></tr></thead>
  <tbody>
    {% for row in rows %}
      <tr>
        <td>{{ row.employee_id }}</td>
        <td>{{ row.name }}</td>
        <td>{{ row.role }}</td>
        <td>{{ row.start_time }}</td>
        <td>{{ row.end_time }}</td>
      </tr>
    {% else %}
      <tr><td colspan="5" class="muted">当前没有值班记录。</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
