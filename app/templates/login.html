{% extends "base.html" %}
{% block title %}登录 · Teabar{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>登录</h1>
  <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
    <label>登录名
      <input type="text" name="login_name" value="{{ login_name or '' }}" autocomplete="username" required>
    </label>
    <label>密码
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="primary">登录</button>
  </form>
  <details class="hint">
    <summary>演示账号</summary>
    <ul>
      <li>顾客（游客）：guesta / Guest#2026</li>
      <li>顾客（游客）：guestb / Guest#2026</li>
      <li>会员：membera / Member#2026</li>
      <li>会员：memberb / Member#2026</li>
      <li>店员：clerk1 / Clerk#2026</li>
      <li>店长：manager1 / Manager#2026</li>
    </ul>
  </details>
</section>
{% endblock %}
